name: Validate TreEvo hypothesis tree MVP

on:
  push:
    paths:
      - "core/tre_evo/**"
      - "tests/test_tre_evo_tree.py"
      - "docs/standardization/**"
      - ".github/workflows/validate-tree-mvp.yml"
  pull_request:
    paths:
      - "core/tre_evo/**"
      - "tests/test_tre_evo_tree.py"
      - "docs/standardization/**"
      - ".github/workflows/validate-tree-mvp.yml"
  workflow_dispatch:

jobs:
  tree-mvp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install "jsonschema>=4,<5" "numpy>=1.24,<3"
      - name: Check RFC schemas and examples
        run: python docs/standardization/validate.py
      - name: Run isolated tree store, CLI, and read-only miner tests
        run: python -m unittest discover -s tests -p 'test_tre_evo_tree.py' -v
      - name: Check Python syntax
        run: python -m compileall -q core/tre_evo tests/test_tre_evo_tree.py
