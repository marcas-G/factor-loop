name: Validate architecture RFC contracts

on:
  push:
    paths:
      - "docs/standardization/**"
      - ".github/workflows/validate-standardization.yml"
  pull_request:
    paths:
      - "docs/standardization/**"
      - ".github/workflows/validate-standardization.yml"
  workflow_dispatch:

jobs:
  contract-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema checker
        run: python -m pip install "jsonschema>=4,<5"
      - name: Validate RFC contracts
        run: python docs/standardization/validate.py
      - name: Verify checker syntax
        run: python -m py_compile docs/standardization/validate.py
