name: Validate corpus dashboard

on:
  push:
    paths:
      - 'web/**'
      - 'core/corpus_autoloop/dashboard_api.py'
      - 'tests/test_corpus_dashboard_api.py'
      - 'docs/corpus-dashboard.md'
      - '.github/workflows/validate-corpus-dashboard.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'core/corpus_autoloop/dashboard_api.py'
      - 'tests/test_corpus_dashboard_api.py'
      - 'docs/corpus-dashboard.md'
      - '.github/workflows/validate-corpus-dashboard.yml'
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
  dashboard-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1'
      - run: python -m unittest discover -s tests -p 'test_corpus_dashboard_api.py' -v
