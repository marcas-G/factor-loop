name: Validate corpus-guided autoloop

on:
  push:
    paths:
      - "core/corpus_autoloop/**"
      - "corpora/daodejing/**"
      - "tests/test_corpus_*.py"
      - "docs/corpus-autoloop.md"
      - ".agents/skills/corpus-autoloop/**"
      - ".github/workflows/validate-corpus-autoloop.yml"
  pull_request:
    paths:
      - "core/corpus_autoloop/**"
      - "corpora/daodejing/**"
      - "tests/test_corpus_*.py"
      - "docs/corpus-autoloop.md"
      - ".agents/skills/corpus-autoloop/**"
      - ".github/workflows/validate-corpus-autoloop.yml"
  workflow_dispatch:

jobs:
  corpus-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install "jsonschema>=4,<5"
      - name: Check 81 chapters and complete workflow
        run: python -m unittest discover -s tests -p 'test_corpus_*.py' -v
      - name: Check Python syntax
        run: python -m compileall -q core/corpus_autoloop tests/test_corpus_execution_adapter.py
