name: Validate TreEvo refinement agent

on:
  push:
    paths:
      - "core/tre_evo/**"
      - "tests/test_tre_evo_*.py"
      - "docs/standardization/**"
      - ".agents/skills/tre-evo-refinement/**"
      - ".github/workflows/validate-refinement-agent.yml"
  pull_request:
    paths:
      - "core/tre_evo/**"
      - "tests/test_tre_evo_*.py"
      - "docs/standardization/**"
      - ".agents/skills/tre-evo-refinement/**"
      - ".github/workflows/validate-refinement-agent.yml"
  workflow_dispatch:

jobs:
  refinement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install "jsonschema>=4,<5" "numpy>=1.24,<3"
      - name: Validate reference contracts
        run: python docs/standardization/validate.py
      - name: Test tree and refinement modules
        run: python -m unittest discover -s tests -p 'test_tre_evo_*.py' -v
      - name: Python syntax
        run: python -m compileall -q core/tre_evo tests/test_tre_evo_refinement.py
